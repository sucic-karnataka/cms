name: Deploy Hugo to GitHub Pages

on:
  push:
    branches:
      - main
  # Triggered by state content repos when editors publish content
  repository_dispatch:
    types: [state-content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.169.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch state content — Karnataka
        run: |
          git clone --depth=1 https://github.com/anand-raj/cms-content-karnataka.git /tmp/karnataka
          [ -d /tmp/karnataka/content/articles ] && cp -r /tmp/karnataka/content/articles/. content/articles/ || true
          [ -d /tmp/karnataka/content/events ]   && cp -r /tmp/karnataka/content/events/.   content/events/   || true
          [ -d /tmp/karnataka/content/news ]     && cp -r /tmp/karnataka/content/news/.     content/news/     || true

      # Add more states here following the same pattern, e.g.:
      # - name: Fetch state content — Tamil Nadu
      #   run: |
      #     git clone --depth=1 https://github.com/anand-raj/cms-content-tamilnadu.git /tmp/tamilnadu
      #     [ -d /tmp/tamilnadu/content/articles ] && cp -r /tmp/tamilnadu/content/articles/. content/articles/ || true
      #     [ -d /tmp/tamilnadu/content/events ]   && cp -r /tmp/tamilnadu/content/events/.   content/events/   || true
      #     [ -d /tmp/tamilnadu/content/news ]     && cp -r /tmp/tamilnadu/content/news/.     content/news/     || true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Check for newer Hugo release
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          def version(value):
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", value)
              if not match:
                  raise ValueError("Unexpected release version format")
              return tuple(map(int, match.groups()))

          try:
              pinned = os.environ["HUGO_VERSION"]
              request = urllib.request.Request(
                  "https://api.github.com/repos/gohugoio/hugo/releases/latest",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "User-Agent": "cms-hugo-version-check",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  latest = json.load(response)["tag_name"]
              newer = version(latest) > version(pinned)
              url = "https://github.com/gohugoio/hugo/releases/tag/" + latest
              message = f"Hugo build pin: {pinned}; latest stable release: {latest}."
              print(message)
              if newer:
                  print(f"::warning title=Hugo upgrade available::{message} Review {url} and test before upgrading. The build remains pinned.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"### Hugo version check\n{message}\n\n[Release notes]({url})\n")
          except Exception:
              # Advisory only: API outages must not block content publishing.
              print("::warning title=Hugo version check unavailable::Could not check the latest Hugo release. The build remains pinned.")
          PY

      - name: Validate content paths
        run: python scripts/validate_content_paths.py

      - name: Build
        run: hugo --minify --environment production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
